<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      font-size: 15px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text, #202938); background: transparent; }
    .board {
      display: grid;
      grid-template-columns: minmax(250px, 2fr) repeat(3, minmax(145px, 1fr));
      gap: 12px;
      align-items: stretch;
    }
    .zone {
      min-height: 190px;
      padding: 10px;
      border: 1px solid rgba(128, 145, 170, .45);
      border-radius: 10px;
      background: rgba(128, 145, 170, .08);
      transition: border-color .12s, background-color .12s;
    }
    .zone.over {
      border-color: #4b83e6;
      background: rgba(75, 131, 230, .14);
    }
    .zone-title {
      margin: 0 0 9px;
      font-size: 15px;
      font-weight: 700;
    }
    .zone-items {
      display: flex;
      min-height: 135px;
      flex-direction: column;
      gap: 7px;
    }
    #source .zone-items {
      max-height: 335px;
      overflow-y: auto;
      padding-right: 3px;
    }
    .field {
      padding: 8px 9px;
      border: 1px solid rgba(128, 145, 170, .5);
      border-radius: 7px;
      background: var(--item-bg, #fff);
      cursor: grab;
      line-height: 1.3;
      overflow-wrap: anywhere;
      user-select: none;
    }
    .field:active { cursor: grabbing; }
    .empty {
      padding: 8px 4px;
      color: #778196;
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #source { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .board { grid-template-columns: 1fr; }
      #source { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="board" id="board"></div>
  <script>
    const parentWindow = window.parent;
    const board = document.getElementById("board");
    let state = [];
    let initialized = false;
    let resetKey;
    let draggedItem = null;
    let lastHeight = 0;

    function post(type, fields) {
      parentWindow.postMessage({ isStreamlitMessage: true, type, ...fields }, "*");
    }

    function setHeight() {
      const height = Math.ceil(document.documentElement.scrollHeight);
      if (height !== lastHeight) {
        lastHeight = height;
        post("streamlit:setFrameHeight", { height });
      }
    }

    function sendValue() {
      post("streamlit:setComponentValue", { value: state, dataType: "json" });
    }

    function render() {
      board.replaceChildren();
      for (const container of state) {
        const zone = document.createElement("section");
        zone.className = "zone";
        zone.id = container.header === "Daftar Kolom" ? "source" : "";
        zone.dataset.header = container.header;

        const title = document.createElement("h3");
        title.className = "zone-title";
        title.textContent = container.header;
        zone.appendChild(title);

        const list = document.createElement("div");
        list.className = "zone-items";
        for (const value of container.items) {
          const item = document.createElement("div");
          item.className = "field";
          item.draggable = true;
          item.textContent = value;
          item.addEventListener("dragstart", event => {
            draggedItem = { value, source: container.header };
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", value);
          });
          list.appendChild(item);
        }
        if (container.items.length === 0) {
          const hint = document.createElement("div");
          hint.className = "empty";
          hint.textContent = container.header === "Daftar Kolom"
            ? "Tidak ada kolom tersisa."
            : "Tarik kolom ke sini.";
          list.appendChild(hint);
        }
        zone.appendChild(list);

        zone.addEventListener("dragover", event => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          zone.classList.add("over");
        });
        zone.addEventListener("dragleave", event => {
          if (!zone.contains(event.relatedTarget)) zone.classList.remove("over");
        });
        zone.addEventListener("drop", event => {
          event.preventDefault();
          zone.classList.remove("over");
          if (!draggedItem) return;

          const targetHeader = container.header;
          const sourceIndex = state.findIndex(section => section.header === draggedItem.source);
          const targetIndex = state.findIndex(section => section.header === targetHeader);
          if (sourceIndex < 0 || targetIndex < 0) return;

          const next = state.map(section => ({
            header: section.header,
            items: [...section.items],
          }));
          const [value] = next[sourceIndex].items.splice(
            next[sourceIndex].items.indexOf(draggedItem.value), 1
          );
          if (value === undefined) return;

          const targetItems = next[targetIndex].items;
          const targetItem = event.target.closest(".field");
          const targetPosition = targetItem
            ? targetItems.indexOf(targetItem.textContent)
            : targetItems.length;
          const insertAt = targetPosition < 0 ? targetItems.length : targetPosition;
          targetItems.splice(insertAt, 0, value);
          state = next;
          draggedItem = null;
          render();
          sendValue();
        });
        board.appendChild(zone);
      }
      requestAnimationFrame(setHeight);
    }

    window.addEventListener("message", event => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      if (!initialized || args.resetKey !== resetKey) {
        state = JSON.parse(JSON.stringify(args.items || []));
        resetKey = args.resetKey;
        initialized = true;
        render();
      }
    });

    post("streamlit:componentReady", { apiVersion: 1 });
    post("streamlit:setFrameHeight", { height: 230 });
  </script>
</body>
</html>
